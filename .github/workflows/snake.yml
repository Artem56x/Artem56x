name: Generate Snake

on:
  workflow_dispatch:

jobs:
  generate:
     runs-on: ubuntu-latest
     steps:
  - name: Generate Snake
    uses: Platane/snk@v3
    with:
      github_user_name: Artem56x
      outputs: dist/github-contribution-grid-snake.svg

  - name: Deploy Snake
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./dist

